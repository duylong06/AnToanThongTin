name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q --cov=src/dt19 --cov-report=term-missing
      - name: Chặn commit khóa riêng
        run: |
          if git ls-files | grep -E '\.key$|private'; then
            echo "Phát hiện tệp khóa riêng trong kho mã"; exit 1
          fi
